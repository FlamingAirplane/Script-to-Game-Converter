<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Narrative Bridge</title>
    <meta name="description" content="Narrative Bridge turns screenplays and prose into playable interactive stories — Ink, Twine, Unity and Unreal — right in your browser." />
    <script>
      // Apply the saved theme before first paint (see src/ui/ThemeToggle.tsx).
      try {
        var t = localStorage.getItem('narrative-bridge.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
