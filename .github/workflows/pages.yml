# Builds Narrative Bridge and publishes it to GitHub Pages on every push to main.
# The site also serves the offline writer edition at ./Narrative-Bridge.html.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # The admin design editor's password (#admin): a repository secret, built in only as a salted hash.
      - run: npm run build
        env:
          NB_ADMIN_PASSWORD: ${{ secrets.NB_ADMIN_PASSWORD }}
          # The live design's Gist (the admin design editor publishes there; no commit needed).
          NB_DESIGN_GIST: ${{ vars.NB_DESIGN_GIST }}
      - name: Add the offline writer edition to the site
        env:
          NB_ADMIN_PASSWORD: ${{ secrets.NB_ADMIN_PASSWORD }}
          NB_DESIGN_GIST: ${{ vars.NB_DESIGN_GIST }}
        run: |
          npm run build:single
          cp release/Narrative-Bridge.html dist/Narrative-Bridge.html
          cp WRITERS.md dist/WRITERS.md
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
