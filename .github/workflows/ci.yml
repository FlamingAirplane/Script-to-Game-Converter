# Checks every pull request: typecheck, unit tests, both builds, and the browser end-to-end
# tests (the offline writer file, the website offline, and the #admin design editor) in WebKit
# (Safari's engine) and Chromium.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps webkit chromium
      - run: npm run test:e2e
      - name: No screen scrolls sideways (320–2560 px)
        run: |
          node tests/e2e/overflow.mjs
          WIDTHS=320,375,600,900,1100,1200,1600,2560 node tests/e2e/overflow.mjs
      - name: Website works offline after one visit
        run: npm run test:offline
      - name: Design editor is password-locked and edits the app live
        run: npm run test:admin
